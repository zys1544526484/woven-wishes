<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一日六厘米：AI共织锦愿 手机版参赛封面</title>
  <style>
    @font-face {
      font-family: "Noto Serif SC";
      src: url("/src/assets/fonts/noto-serif-sc-subset.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #f0dfc0;
      background: #020c18 url("./cover-ai-background-v1.png") 66% center / auto 100% no-repeat;
      font-family: "Noto Serif SC", "Microsoft YaHei", serif;
    }
    .cover {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 8.5% 7.5%;
      background:
        linear-gradient(180deg, rgba(2,12,24,.98) 0%, rgba(2,12,24,.9) 19%, rgba(2,12,24,.24) 38%, rgba(2,12,24,.12) 70%, rgba(2,12,24,.97) 100%),
        radial-gradient(circle at 50% 49%, rgba(8,116,124,.08), transparent 55%);
    }
    .kicker {
      color: #c5a366;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 32px;
      line-height: 1.7;
      letter-spacing: .12em;
      text-align: center;
    }
    h1 { margin: 6.5% 0 0; font-weight: 400; line-height: 1.16; text-align: center; }
    h1 span { display: block; color: #f2c676; font-size: 150px; letter-spacing: .06em; text-shadow: 0 0 34px rgba(214,164,88,.2); }
    h1 strong { display: block; margin-top: .22em; color: #f0dfc0; font-size: 88px; font-weight: 400; letter-spacing: .16em; }
    .rule { display: flex; align-items: center; gap: 22px; width: 42%; margin: 4.6% auto 0; }
    .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #d6a458); }
    .rule::after { background: linear-gradient(90deg, #d6a458, transparent); }
    .rule i { width: 13px; height: 13px; background: #a33a2b; transform: rotate(45deg); }
    .tagline {
      position: absolute;
      left: 7.5%;
      right: 7.5%;
      bottom: 16%;
      margin: 0;
      color: #efd7a6;
      font-size: 62px;
      line-height: 1.75;
      letter-spacing: .08em;
      text-align: center;
      text-shadow: 0 3px 16px #020c18;
    }
    .meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 9%;
      display: flex;
      justify-content: center;
      gap: 22px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 27px;
      letter-spacing: .1em;
    }
    .meta span { padding: .62em 1.1em; border: 1px solid rgba(214,164,88,.68); border-radius: 999px; color: #d6a458; background: rgba(2,12,24,.76); }
    .meta span:last-child { color: #63cbd0; border-color: rgba(8,116,124,.9); }
    footer {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 3.5%;
      color: rgba(240,223,192,.68);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 22px;
      line-height: 1.65;
      letter-spacing: .06em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="cover">
    <div class="kicker">第八届“讲好中国故事”创意传播国际大赛<br />AI创作主题赛</div>
    <h1><span>一日六厘米</span><strong>AI共织锦愿</strong></h1>
    <div class="rule"><i></i></div>
    <p class="tagline">一人提经，一人送梭<br />把心愿织进经纬</p>
    <div class="meta"><span>AI交互应用组</span><span>非遗新生 × 未来想象</span></div>
    <footer>受南京云锦木机妆花两人协作启发的数字体验 · 并非工艺复原</footer>
  </main>
</body>
</html>
