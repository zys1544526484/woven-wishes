<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一日六厘米：AI共织锦愿 参赛封面</title>
  <style>
    @font-face {
      font-family: "Noto Serif SC";
      src: url("/src/assets/fonts/noto-serif-sc-subset.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #f0dfc0;
      background: #020c18 url("./cover-ai-background-v1.png") center / cover no-repeat;
      font-family: "Noto Serif SC", "Microsoft YaHei", serif;
    }
    .cover {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 8.2% 0 6.7% 7.1%;
      background:
        linear-gradient(90deg, rgba(2, 12, 24, .97) 0%, rgba(2, 12, 24, .9) 28%, rgba(2, 12, 24, .3) 52%, rgba(2, 12, 24, 0) 68%),
        radial-gradient(circle at 20% 48%, rgba(8, 116, 124, .13), transparent 34%);
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: .72em;
      color: #c5a366;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: clamp(20px, 1.02vw, 40px);
      letter-spacing: .16em;
    }
    .kicker::before { content: ""; width: 3.7em; height: 1px; background: linear-gradient(90deg, transparent, #d6a458); }
    h1 { margin: 5.4% 0 0; font-weight: 400; line-height: 1.12; }
    h1 span { display: block; color: #f2c676; font-size: clamp(94px, 7.25vw, 278px); letter-spacing: .05em; text-shadow: 0 0 34px rgba(214, 164, 88, .17); }
    h1 strong { display: block; margin-top: .18em; color: #f0dfc0; font-size: clamp(56px, 4.15vw, 160px); font-weight: 400; letter-spacing: .13em; }
    .rule { display: flex; align-items: center; gap: 22px; width: 26%; margin: 4.3% 0 3%; }
    .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #d6a458); }
    .rule::after { background: linear-gradient(90deg, #d6a458, transparent); }
    .rule i { width: 13px; height: 13px; background: #a33a2b; transform: rotate(45deg); }
    .tagline { margin: 0; color: #e8cf9f; font-size: clamp(34px, 2.05vw, 79px); line-height: 1.72; letter-spacing: .08em; }
    .meta {
      position: absolute;
      left: 7.1%;
      bottom: 8.3%;
      display: flex;
      gap: 22px;
      align-items: center;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: clamp(18px, .9vw, 35px);
      letter-spacing: .13em;
    }
    .meta span { padding: .6em 1.12em; border: 1px solid rgba(214, 164, 88, .62); border-radius: 999px; color: #d6a458; background: rgba(2, 12, 24, .68); }
    .meta span:last-child { color: #63cbd0; border-color: rgba(8, 116, 124, .86); }
    footer {
      position: absolute;
      right: 4.4%;
      bottom: 3.8%;
      color: rgba(240, 223, 192, .68);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: clamp(15px, .71vw, 27px);
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="cover">
    <div class="kicker">第八届“讲好中国故事”创意传播国际大赛 · AI创作主题赛</div>
    <h1><span>一日六厘米</span><strong>AI共织锦愿</strong></h1>
    <div class="rule"><i></i></div>
    <p class="tagline">一人提经，一人送梭<br />把心愿织进经纬</p>
    <div class="meta"><span>AI交互应用组</span><span>非遗新生 × 未来想象</span></div>
    <footer>受南京云锦木机妆花两人协作启发的数字体验 · 并非工艺复原</footer>
  </main>
</body>
</html>
